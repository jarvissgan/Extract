name: Extract
options:
  bundleIdPrefix: com.extract
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
packages:
  Auth0:
    url: https://github.com/auth0/Auth0.swift
    from: 2.10.0
targets:
  Extract:
    type: application
    platform: iOS
    sources:
      - path: Extract
    dependencies:
      - package: Auth0
    info:
      path: Extract/Resources/Info.plist
      properties:
        CFBundleDisplayName: Extract
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: auth0
            CFBundleURLSchemes: ["$(PRODUCT_BUNDLE_IDENTIFIER)"]
        API_BASE_URL: $(API_BASE_URL)
        AUTH0_DOMAIN: $(AUTH0_DOMAIN)
        AUTH0_CLIENT_ID: $(AUTH0_CLIENT_ID)
        AUTH0_AUDIENCE: $(AUTH0_AUDIENCE)
        AUTH_MODE: $(AUTH_MODE)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: false
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
