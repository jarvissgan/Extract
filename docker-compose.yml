# Local MariaDB for development; started automatically by `npm run local` and `npm test`.
# Separate from the database in .env: fixed credentials, port LOCAL_DB_PORT (default 3307).
# Keep these values in sync with scripts/use-local-db.js.
services:
  db:
    image: mariadb:11
    container_name: extract-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: extract
      MARIADB_USER: extract
      MARIADB_PASSWORD: extract
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "${LOCAL_DB_PORT:-3307}:3306"
    volumes:
      - extract-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  extract-db-data:
