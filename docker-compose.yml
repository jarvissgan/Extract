# Local MariaDB for development; started automatically by `npm run local` and `npm test`.
# Reads DB_* values from .env. Tables are created by `npm run db:migrate` (run automatically by those scripts).
services:
  db:
    image: mariadb:11
    container_name: extract-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-extract}
      MARIADB_USER: ${DB_USER:-extract}
      MARIADB_PASSWORD: ${DB_PASSWORD:-extract}
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - extract-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 20

volumes:
  extract-db-data:
