# Continuous deployment: after CI passes on master, build the production image here, push it
# to GitHub's container registry, and have the server switch to it (deploy/deploy.sh rolls
# back by itself if the new version isn't healthy).
#
# One-time setup: run `sudo ./deploy/setup-cd.sh` on the server and add the secrets and
# variables it prints. Until then this workflow does nothing. See deploy/README.md.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  # deploy master by hand from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# one deploy at a time; a newer one waits for the current one to finish
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check the server is set up
        id: ready
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          DOMAIN: ${{ vars.APP_DOMAIN }}
        run: |
          if [ -z "$HOST" ] || [ -z "$DOMAIN" ]; then
            echo "::notice::Deploy skipped: run deploy/setup-cd.sh on the server and add the secrets and variables it prints."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          ref: ${{ env.SHA }}

      - name: Image name
        if: steps.ready.outputs.ok == 'true'
        id: image
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          repo="${GITHUB_REPOSITORY#*/}"
          echo "package=${repo,,}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.ready.outputs.ok == 'true'

      - uses: docker/login-action@v3
        if: steps.ready.outputs.ok == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        if: steps.ready.outputs.ok == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ env.SHA }}
            ${{ steps.image.outputs.name }}:latest
          # public Auth0 SPA settings, baked into the website
          build-args: |
            VITE_authDomain=${{ vars.AUTH0_DOMAIN }}
            VITE_authClientID=${{ vars.AUTH0_CLIENT_ID }}
            VITE_authApiAudience=${{ vars.AUTH0_AUDIENCE }}
            VITE_redirectURL=https://${{ vars.APP_DOMAIN }}/setup
            VITE_axiosBaseUrl=/api
            APP_VERSION=${{ env.SHA }}
            BUILD_TIME=${{ steps.image.outputs.built_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to the server
        if: steps.ready.outputs.ok == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ env.SHA }}
          # lets the server download the image; it expires when this job ends
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/deploy_key -p "$PORT" \
            -o StrictHostKeyChecking=yes -o HostKeyAlias="$HOST" -o BatchMode=yes \
            "$USER@$HOST" "deploy $IMAGE ${{ github.actor }}" | tee "$RUNNER_TEMP/deploy.log"

      - name: Summary
        if: steps.ready.outputs.ok == 'true'
        run: |
          echo "Deployed \`${SHA::7}\` to https://${{ vars.APP_DOMAIN }}" >> "$GITHUB_STEP_SUMMARY"
          # the server's last nightly backup check (see deploy/backup.sh --check)
          status="$(sed -n 's/^BACKUP-STATUS: //p' "$RUNNER_TEMP/deploy.log" | tail -n 1)"
          [ -n "$status" ] || status="unknown: the server did not report the backup check"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Backups:** $status" >> "$GITHUB_STEP_SUMMARY"
          case "$status" in
            ok*) ;;
            *) echo "::warning title=Backups::$status" ;;
          esac

      # Every deploy pushes a new image; private registry storage is limited, so keep the 10
      # newest (plenty to redeploy a recent commit; the server keeps its own previous image for
      # rollback). Never fails the deploy: if GitHub refuses, it's a warning (see deploy/README.md).
      - name: Remove old images from the registry
        if: steps.ready.outputs.ok == 'true'
        continue-on-error: true
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ steps.image.outputs.package }}
          package-type: container
          min-versions-to-keep: 10
