# Continuous deployment: after CI passes on master, build the production image here, push it
# to GitHub's container registry, and have the server switch to it (deploy/deploy.sh rolls
# back by itself if the new version isn't healthy).
#
# One-time setup: run `sudo ./deploy/setup-cd.sh` on the server and add the secrets and
# variables it prints. Until then this workflow does nothing. See deploy/README.md.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  # deploy master by hand from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# one deploy at a time; a newer one waits for the current one to finish
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Check the server is set up
        id: ready
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          DOMAIN: ${{ vars.APP_DOMAIN }}
        run: |
          if [ -z "$HOST" ] || [ -z "$DOMAIN" ]; then
            echo "::notice::Deploy skipped: run deploy/setup-cd.sh on the server and add the secrets and variables it prints."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.ready.outputs.ok == 'true'
        with:
          ref: ${{ env.SHA }}

      - name: Image name
        if: steps.ready.outputs.ok == 'true'
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3
        if: steps.ready.outputs.ok == 'true'

      - uses: docker/login-action@v3
        if: steps.ready.outputs.ok == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        if: steps.ready.outputs.ok == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ env.SHA }}
            ${{ steps.image.outputs.name }}:latest
          # public Auth0 SPA settings, baked into the website
          build-args: |
            VITE_authDomain=${{ vars.AUTH0_DOMAIN }}
            VITE_authClientID=${{ vars.AUTH0_CLIENT_ID }}
            VITE_authApiAudience=${{ vars.AUTH0_AUDIENCE }}
            VITE_redirectURL=https://${{ vars.APP_DOMAIN }}/setup
            VITE_axiosBaseUrl=/api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to the server
        if: steps.ready.outputs.ok == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          IMAGE: ${{ steps.image.outputs.name }}:${{ env.SHA }}
          # lets the server download the image; it expires when this job ends
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$REGISTRY_TOKEN" | ssh -i ~/.ssh/deploy_key -p "$PORT" \
            -o StrictHostKeyChecking=yes -o HostKeyAlias="$HOST" -o BatchMode=yes \
            "$USER@$HOST" "deploy $IMAGE ${{ github.actor }}"

      - name: Summary
        if: steps.ready.outputs.ok == 'true'
        run: echo "Deployed \`${SHA::7}\` to https://${{ vars.APP_DOMAIN }}" >> "$GITHUB_STEP_SUMMARY"
