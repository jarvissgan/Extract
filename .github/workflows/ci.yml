name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

      # the production image (deploy/README.md) must keep building
      - name: Build production image
        run: >
          docker build
          --build-arg VITE_authDomain=example.us.auth0.com
          --build-arg VITE_authClientID=ci
          --build-arg VITE_authApiAudience=https://ci
          --build-arg VITE_redirectURL=https://ci.example.com/setup
          -t extract-app:ci .

      # uses the local Docker database and offline login, same as on a dev machine
      - run: cp .env.example .env
      - name: API tests
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Your local database may be MySQL rather than MariaDB: migrations and the API must work on both.
  mysql:
    name: API tests on MySQL 8
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: extract
          MYSQL_USER: extract
          MYSQL_PASSWORD: extract
        ports: ["3308:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      LOCAL_DB_PORT: 3308
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrations
        run: node --import ./scripts/use-local-db.js scripts/migrate.js
      - name: Migrations again (must be a no-op)
        run: node --import ./scripts/use-local-db.js scripts/migrate.js
      - name: API tests
        run: node --import ./scripts/use-local-db.js --test --test-concurrency=1 "tests/**/*.test.js"
